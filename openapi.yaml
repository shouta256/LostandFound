openapi: 3.1.1
info:
  title: Lost & Found Tracker API
  version: 0.1.0
  summary: CM333 MVP API for US1-US11.
  description: HTTPS JSON API; see API_CONTRACT.md for confirmed workflow and R3.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/google:
    post:
      tags: [Authentication]
      operationId: loginWithGoogle
      summary: Sign in with Google (US1).
      description: Exchange a valid Google ID token for an application bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}
      responses:
        '200':
          description: LoginResponse.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}
        '400': {$ref: '#/components/responses/Error', description: INVALID_JSON.}
        '401': {$ref: '#/components/responses/Error', description: INVALID_GOOGLE_TOKEN.}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '415': {$ref: '#/components/responses/Error', description: UNSUPPORTED_MEDIA_TYPE.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
        '503': {$ref: '#/components/responses/Error', description: AUTH_PROVIDER_UNAVAILABLE.}
  /users/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user's profile and role (US1).
      description: Returns the authenticated user only.
      responses:
        '200':
          description: User.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/User'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /items:
    post:
      tags: [Items]
      operationId: createItem
      summary: Report a lost or found item with its details (US2-US4).
      description: Sets created_by to the authenticated user.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ItemCreate'}}
      responses:
        '201':
          description: Created Item.
          headers:
            Location:
              required: true
              schema: {type: string}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Item'}}
        '400': {$ref: '#/components/responses/Error', description: INVALID_JSON.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '415': {$ref: '#/components/responses/Error', description: UNSUPPORTED_MEDIA_TYPE.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
    get:
      tags: [Items]
      operationId: listItems
      summary: Browse or search active lost/found listings (US4-US6).
      description: Temporarily unauthenticated for local development; authentication will be added with Google login.
      security: []
      parameters:
        - {$ref: '#/components/parameters/SearchQuery'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: ItemPage.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ItemPage'}}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /items/{item_id}:
    parameters:
      - {$ref: '#/components/parameters/ItemId'}
    get:
      tags: [Items]
      operationId: getItem
      summary: Get listing details and saved status (US4, US7, US10).
      description: Returned items remain accessible by ID.
      responses:
        '200': {$ref: '#/components/responses/Item'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '404': {$ref: '#/components/responses/Error', description: ITEM_NOT_FOUND.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /items/{item_id}/status:
    parameters:
      - {$ref: '#/components/parameters/ItemId'}
    patch:
      tags: [Items]
      operationId: updateItemStatus
      summary: Update item recovery status (US10).
      description: Team members only.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ItemStatusUpdate'}}
      responses:
        '200': {$ref: '#/components/responses/Item'}
        '400': {$ref: '#/components/responses/Error', description: INVALID_JSON.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '404': {$ref: '#/components/responses/Error', description: ITEM_NOT_FOUND.}
        '409': {$ref: '#/components/responses/Error', description: INVALID_STATUS_TRANSITION.}
        '415': {$ref: '#/components/responses/Error', description: UNSUPPORTED_MEDIA_TYPE.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /claims:
    post:
      tags: [Claims]
      operationId: createClaim
      summary: Submit private ownership information for review (US8).
      description: Sets claimant_id to the authenticated user.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ClaimCreate'}}
      responses:
        '201':
          description: Created Claim.
          headers:
            Location:
              required: true
              schema: {type: string}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Claim'}}
        '400': {$ref: '#/components/responses/Error', description: INVALID_JSON.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN for own-listing claims or disallowed access.}
        '404': {$ref: '#/components/responses/Error', description: ITEM_NOT_FOUND.}
        '409': {$ref: '#/components/responses/Error', description: ITEM_NOT_CLAIMABLE or DUPLICATE_PENDING_CLAIM.}
        '415': {$ref: '#/components/responses/Error', description: UNSUPPORTED_MEDIA_TYPE.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
    get:
      tags: [Claims]
      operationId: listClaims
      summary: Retrieve submitted claims for tracking or team review (US8-US9).
      description: Students see their own claims; team members see all claims.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: ClaimPage.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/ClaimPage'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /claims/{claim_id}:
    parameters:
      - {$ref: '#/components/parameters/ClaimId'}
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get a claim, review outcome, and pickup information (US8-US9, US11).
      description: Claimant or team member only; pickup is visible only after approval.
      responses:
        '200':
          description: ClaimDetail.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/ClaimDetail'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '404': {$ref: '#/components/responses/Error', description: CLAIM_NOT_FOUND.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /claims/{claim_id}/decision:
    parameters:
      - {$ref: '#/components/parameters/ClaimId'}
    patch:
      tags: [Claims]
      operationId: decideClaim
      summary: Approve or reject an ownership claim (US9; approval advances US10).
      description: Team members only, excluding the claimant.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ClaimDecision'}}
      responses:
        '200':
          description: Claim.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Claim'}}
        '400': {$ref: '#/components/responses/Error', description: INVALID_JSON.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN for self-review or disallowed access.}
        '404': {$ref: '#/components/responses/Error', description: CLAIM_NOT_FOUND.}
        '409': {$ref: '#/components/responses/Error', description: CLAIM_ALREADY_DECIDED or CLAIM_APPROVAL_CONFLICT.}
        '415': {$ref: '#/components/responses/Error', description: UNSUPPORTED_MEDIA_TYPE.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
  /claims/{claim_id}/pickup:
    parameters:
      - {$ref: '#/components/parameters/ClaimId'}
    patch:
      tags: [Claims]
      operationId: updateClaimPickup
      summary: Set an approved claim's campus pickup location and readiness (US11).
      description: Team members only, for approved claims.
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PickupUpdate'}}
      responses:
        '200':
          description: Pickup.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pickup'}}
        '400': {$ref: '#/components/responses/Error', description: INVALID_JSON.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Error', description: FORBIDDEN.}
        '404': {$ref: '#/components/responses/Error', description: CLAIM_NOT_FOUND.}
        '409': {$ref: '#/components/responses/Error', description: CLAIM_NOT_APPROVED.}
        '415': {$ref: '#/components/responses/Error', description: UNSUPPORTED_MEDIA_TYPE.}
        '422': {$ref: '#/components/responses/Error', description: VALIDATION_ERROR.}
        '500': {$ref: '#/components/responses/Error', description: INTERNAL_ERROR.}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Application bearer token returned by Google login.
  parameters:
    ItemId:
      name: item_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      description: Results sort by created_at DESC, then id DESC.
    Offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    SearchQuery:
      name: q
      in: query
      required: false
      schema: {type: string, minLength: 1, maxLength: 200}
      description: Case-insensitive literal substring in name, category, or description.
  headers:
    NoStore:
      required: true
      schema: {type: string, const: no-store}
      description: Do not cache authentication or claim responses.
  schemas:
    UUID: {type: string, format: uuid}
    UtcTimestamp:
      type: string
      format: date-time
      pattern: Z$
      description: UTC timestamp ending in Z.
    ItemStatus: {type: string, enum: [available, claimed, returned]}
    ClaimStatus: {type: string, enum: [pending, approved, rejected]}
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string}
        name: {type: [string, 'null']}
        role: {type: string, enum: [student, team_member]}
    ItemFields:
      type: object
      required: [type, name, description, category, date, location]
      properties:
        type: {type: string, enum: [lost, found]}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, minLength: 1, maxLength: 2000}
        category: {type: string, minLength: 1, maxLength: 80}
        date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Date the item was lost or found.
        location:
          type: string
          minLength: 1
          maxLength: 200
          description: Lost/found location, not campus pickup.
    ItemCreate:
      allOf:
        - {$ref: '#/components/schemas/ItemFields'}
      unevaluatedProperties: false
    Item:
      allOf:
        - {$ref: '#/components/schemas/ItemFields'}
        - type: object
          required: [id, status, created_by, created_at, updated_at]
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            status: {$ref: '#/components/schemas/ItemStatus'}
            created_by: {$ref: '#/components/schemas/UUID'}
            created_at: {$ref: '#/components/schemas/UtcTimestamp'}
            updated_at: {$ref: '#/components/schemas/UtcTimestamp'}
    ItemStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/ItemStatus'}
    Claim:
      type: object
      required: [id, item_id, claimant_id, ownership_information, status, reviewed_by, reviewed_at, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        item_id: {$ref: '#/components/schemas/UUID'}
        claimant_id: {$ref: '#/components/schemas/UUID'}
        ownership_information: {type: string, minLength: 1, maxLength: 2000}
        status: {$ref: '#/components/schemas/ClaimStatus'}
        reviewed_by:
          type: [string, 'null']
          format: uuid
          description: Null while pending.
        reviewed_at:
          type: [string, 'null']
          format: date-time
          pattern: Z$
          description: Null while pending.
        created_at: {$ref: '#/components/schemas/UtcTimestamp'}
        updated_at: {$ref: '#/components/schemas/UtcTimestamp'}
    ClaimCreate:
      type: object
      additionalProperties: false
      required: [item_id, ownership_information]
      properties:
        item_id: {$ref: '#/components/schemas/Claim/properties/item_id'}
        ownership_information: {$ref: '#/components/schemas/Claim/properties/ownership_information'}
    ClaimDecision:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [approved, rejected]}
    ClaimDetail:
      allOf:
        - {$ref: '#/components/schemas/Claim'}
        - type: object
          required: [pickup]
          properties:
            pickup:
              oneOf:
                - {$ref: '#/components/schemas/Pickup'}
                - {type: 'null'}
              description: Null when unset or the claim is not approved.
        - if: {properties: {status: {enum: [pending, rejected]}}}
          then: {properties: {pickup: {type: 'null'}}}
    PickupStatus: {type: string, enum: [not_ready, ready]}
    Pickup:
      type: object
      required: [location, status, ready_at]
      properties:
        location: {type: string, minLength: 1, maxLength: 200}
        status: {$ref: '#/components/schemas/PickupStatus'}
        ready_at:
          type: [string, 'null']
          format: date-time
          pattern: Z$
          readOnly: true
          description: Server-recorded readiness time.
      allOf:
        - if: {properties: {status: {const: ready}}}
          then: {properties: {ready_at: {$ref: '#/components/schemas/UtcTimestamp'}}}
          else: {properties: {ready_at: {type: 'null'}}}
    PickupUpdate:
      type: object
      additionalProperties: false
      required: [location, status]
      properties:
        location: {$ref: '#/components/schemas/Pickup/properties/location'}
        status: {$ref: '#/components/schemas/PickupStatus'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [id_token]
      properties:
        id_token: {type: string, minLength: 1, maxLength: 16384}
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: {type: string, minLength: 1}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 3600}
        user: {$ref: '#/components/schemas/User'}
    PageMetadata:
      type: object
      required: [limit, offset, total]
      properties:
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
        total:
          type: integer
          minimum: 0
          description: Authorized matching count before pagination.
    ItemPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [data]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Item'}}
    ClaimPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [data]
          properties:
            data: {type: array, items: {$ref: '#/components/schemas/Claim'}}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: {type: string, enum: [INVALID_JSON, INVALID_GOOGLE_TOKEN, UNAUTHENTICATED, FORBIDDEN, ITEM_NOT_FOUND,
                CLAIM_NOT_FOUND, ITEM_NOT_CLAIMABLE, DUPLICATE_PENDING_CLAIM, CLAIM_ALREADY_DECIDED, CLAIM_APPROVAL_CONFLICT,
                CLAIM_NOT_APPROVED, INVALID_STATUS_TRANSITION, UNSUPPORTED_MEDIA_TYPE, VALIDATION_ERROR, INTERNAL_ERROR,
                AUTH_PROVIDER_UNAVAILABLE]}
            message: {type: string}
            details:
              type: array
              items: {$ref: '#/components/schemas/ValidationDetail'}
              description: Field-validation details, otherwise an empty array.
      description: Errors contain no credentials or private ownership evidence.
    ValidationDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Invalid field path, such as body.name.
        message: {type: string}
  responses:
    Item:
      description: Item.
      content:
        application/json: {schema: {$ref: '#/components/schemas/Item'}}
    Error:
      description: JSON error response.
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    Unauthenticated:
      description: UNAUTHENTICATED.
      headers:
        WWW-Authenticate:
          required: true
          schema: {type: string, const: Bearer}
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
